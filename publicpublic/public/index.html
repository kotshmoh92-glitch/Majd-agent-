<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مجد — المساعد التسويقي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg: #12181a;
    --bg-raised: #182022;
    --ink: #eae3d6;
    --ink-dim: #9aa5a3;
    --gold: #c9a24b;
    --teal: #2f8f83;
    --bubble-user: #23302f;
    --bubble-agent: #182022;
    --border: #263030;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Tajawal', sans-serif;
  }

  body{
    display: flex;
    flex-direction: column;
  }

  header{
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(180deg, var(--bg-raised), var(--bg));
  }

  .mark{
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: conic-gradient(from 200deg, var(--gold), var(--teal), var(--gold));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 20px;
    color: #12181a;
    flex-shrink: 0;
  }

  .title h1{
    margin: 0;
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .title p{
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.3px;
  }

  .status{
    margin-inline-start: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
  }

  .dot{
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--teal);
  }
  .dot.off{ background: #7a4b4b; }

  #chat{
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .msg{
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.65;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.agent{
    align-self: flex-start;
    background: var(--bubble-agent);
    border: 1px solid var(--border);
    border-start-start-radius: 4px;
  }

  .msg.user{
    align-self: flex-end;
    background: var(--bubble-user);
    border: 1px solid #2d3a38;
    border-start-end-radius: 4px;
  }

  .msg.agent .label{
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--gold);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .empty-state{
    margin: auto;
    text-align: center;
    color: var(--ink-dim);
    max-width: 420px;
  }
  .empty-state .mark{ margin: 0 auto 16px; width: 56px; height: 56px; font-size: 26px; }
  .empty-state h2{ color: var(--ink); font-size: 18px; margin-bottom: 6px; }
  .empty-state p{ font-size: 13.5px; line-height: 1.7; }

  form{
    display: flex;
    gap: 10px;
    padding: 16px 24px 22px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    border-top: 1px solid var(--border);
  }

  textarea{
    flex: 1;
    resize: none;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--ink);
    font-family: 'Tajawal', sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    max-height: 140px;
  }
  textarea:focus{ outline: none; border-color: var(--gold); }

  button{
    background: var(--gold);
    color: #12181a;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:disabled{ opacity: 0.4; cursor: default; }
  button:not(:disabled):hover{ opacity: 0.88; }

  .typing{
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing span{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  #chat::-webkit-scrollbar{ width: 8px; }
  #chat::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 8px; }
</style>
</head>
<body>

<header>
  <div class="mark">م</div>
  <div class="title">
    <h1>مجد</h1>
    <p>MARKETING · STRATEGY · MOHAMMAD'S AGENT</p>
  </div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">جاهز</span></div>
</header>

<div id="chat">
  <div class="empty-state" id="emptyState">
    <div class="mark">م</div>
    <h2>أهلاً محمد</h2>
    <p>أنا مجد، مساعدك التسويقي. احكيلي عن الحملة، العميل، أو الفكرة يلي عم تشتغل عليها ونبلش.</p>
  </div>
</div>

<form id="chatForm">
  <textarea id="input" placeholder="اكتب رسالتك..." rows="1"></textarea>
  <button type="submit" id="sendBtn">إرسال</button>
</form>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const emptyState = document.getElementById('emptyState');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  let history = [];

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  function addMessage(role, text) {
    if (emptyState) emptyState.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'agent');
    if (role !== 'user') {
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = 'مجد';
      div.appendChild(label);
    }
    const body = document.createElement('span');
    body.textContent = text;
    div.appendChild(body);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg agent';
    div.id = 'typingIndicator';
    div.innerHTML = '<span class="label">مجد</span><div class="typing"><span></span><span></span><span></span></div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        addMessage('agent', 'صار خطأ: ' + (data.error || 'غير معروف'));
        statusDot.classList.add('off');
        statusText.textContent = 'في مشكلة';
        return;
      }

      addMessage('agent', data.reply);
      history.push({ role: 'assistant', content: data.reply });
      statusDot.classList.remove('off');
      statusText.textContent = 'جاهز';
    } catch (err) {
      removeTyping();
      addMessage('agent', 'ما قدرت أوصل عالسيرفر. تأكد إنه شغال.');
      statusDot.classList.add('off');
      statusText.textContent = 'مقطوع';
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
